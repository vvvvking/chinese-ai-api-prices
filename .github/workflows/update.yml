name: Update Chinese AI model prices

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate README + data/prices.json
        run: python3 scripts/render.py

      - name: Commit if changed
        run: |
          git config user.name  "novai-prices-bot"
          git config user.email "support@aiapi-pro.com"
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git add README.md data/prices.json
          git commit -m "chore: refresh prices ($(date -u +%Y-%m-%d))"
          git push
